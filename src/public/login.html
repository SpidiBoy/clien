<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volcano Gym - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; visibility: hidden; }
        .login-container { max-width: 400px; margin-top: 100px; }
    </style>
    <script>
        if (localStorage.getItem('token')) {
            window.location.replace('/dashboard.html');
        } else {
            document.addEventListener('DOMContentLoaded', () => {
                document.body.style.visibility = 'visible';
            });
        }
    </script>
</head>
<body>

<div class="container login-container">
    <div class="card shadow">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <span style="font-size:40px"></span>
                <h4 class="mt-2 fw-bold">Volcano Gym</h4>
                <p class="text-muted" style="font-size:13px">Sistema de gestión</p>
            </div>
            <div id="mensajeError" class="alert alert-danger" style="display:none;font-size:13px"></div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Usuario</label>
                <input type="text" id="username" class="form-control" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="Ingresa tu contraseña" required>
            </div>
            <button class="btn btn-danger w-100 fw-bold" id="btnLogin" onclick="doLogin()">
                Ingresar
            </button>
        </div>
    </div>
</div>

<script>
    // Permitir Enter para login
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
        const username  = document.getElementById('username').value.trim();
        const password  = document.getElementById('password').value.trim();
        const errorDiv  = document.getElementById('mensajeError');
        const btnLogin  = document.getElementById('btnLogin');

        if (!username || !password) {
            errorDiv.textContent = 'Completa todos los campos';
            errorDiv.style.display = 'block';
            return;
        }

        btnLogin.disabled = true;
        btnLogin.textContent = 'Ingresando...';
        errorDiv.style.display = 'none';

        try {
            const response = await fetch('/api/auth/login', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('token',   data.token);
                localStorage.setItem('usuario', JSON.stringify(data.usuario));
                // Guardar opciones/permisos para uso en el dashboard
                localStorage.setItem('opciones', JSON.stringify(data.opciones || []));
                window.location.replace('/dashboard.html');
            } else {
                errorDiv.textContent = data.message || 'Error al iniciar sesión';
                errorDiv.style.display = 'block';
                btnLogin.disabled = false;
                btnLogin.textContent = 'Ingresar';
            }

        } catch (error) {
            errorDiv.textContent = 'No se pudo conectar al servidor';
            errorDiv.style.display = 'block';
            btnLogin.disabled = false;
            btnLogin.textContent = 'Ingresar';
        }
    }
</script>
</body>
</html>
